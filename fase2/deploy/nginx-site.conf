# Site padrão do nginx na VPS (/etc/nginx/sites-available/default).
# Modelo usado pelo provision.sh: __IP__ é trocado pelo IP público da VPS.
# Igual ao de produção, exceto o "location /": lá, a raiz atende outro
# sistema (contêiner nfe-scrap em 127.0.0.1:8080); aqui, redireciona ao painel.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name __IP__;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://__IP__$request_uri; }
}
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name __IP__;
    ssl_certificate /etc/letsencrypt/live/hostinger-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hostinger-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    client_max_body_size 5m;

    location = /fase2 { return 302 /fase2/; }
    location /fase2/ {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 302 /fase2/; }
}
